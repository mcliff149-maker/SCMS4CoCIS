name: SCMS access and room smoke
version: 1
author: SCMS4CoCIS Team
steps:
  - wait-serial: "help for commands"
  - write-serial: "time 10:00\n"
  - wait-serial: "CLOCK_SET"
  - write-serial: "scan_entry 1001\n"
  - wait-serial: "ENTRY result=GRANTED building=1"
  - write-serial: "scan_entry 1001\n"
  - wait-serial: "DENY_ALREADY_INSIDE"
  - write-serial: "scan_entry 9999\n"
  - wait-serial: "DENY_UNKNOWN_ID"
  - write-serial: "room 1 1001 in\n"
  - wait-serial: "ROOM1_IN result=GRANTED"
  - write-serial: "room 2 1001 in\n"
  - wait-serial: "DENY_ALREADY_IN_ROOM"
  - write-serial: "advance 60\n"
  - wait-serial: "CLOCK_ADVANCE"
  - write-serial: "scan_exit 1001\n"
  - wait-serial: "EXIT result=GRANTED building=0"
  - write-serial: "scan_entry 1002\n"
  - wait-serial: "ENTRY result=GRANTED building=1"
  - write-serial: "time 20:00\n"
  - wait-serial: "CLOCK_SET"
  - write-serial: "scan_exit 1002\n"
  - wait-serial: "DENY_SCHEDULE_CLOSED"
  - write-serial: "status\n"
  - wait-serial: "CLOSED building=1 rooms=0,0 lights=0,0"
